name: MediTriage-AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meditriage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-test-evaluate:
    name: Quality, Tests & Held-out Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov ruff
      - name: Validate syntax and imports
        run: python -m compileall -q triage train_model.py evaluate_model.py benchmarks
      - name: Run correctness lint
        run: ruff check triage train_model.py evaluate_model.py test_model.py benchmarks --select E9,F63,F7,F82
      - name: Train deterministic model
        run: python train_model.py
      - name: Run tests with coverage
        run: |
          pytest test_model.py -v \
            --cov=triage \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-results.xml \
            --cov-fail-under=85
      - name: Run held-out evaluation
        run: python evaluate_model.py
      - name: Upload test and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meditriage-quality-evidence
          path: |
            coverage.xml
            pytest-results.xml
            metrics/latest_model_metrics.json
            metrics/confusion_matrix.png
          if-no-files-found: warn
          retention-days: 30

  container:
    name: Container Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t meditriage-ai:${{ github.sha }} .
