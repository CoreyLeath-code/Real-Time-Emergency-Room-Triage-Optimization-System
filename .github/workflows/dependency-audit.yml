name: Triage Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "37 9 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install vulnerability scanner
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit the pinned requirements and transitive dependencies
        run: python -m pip_audit -r requirements.txt
