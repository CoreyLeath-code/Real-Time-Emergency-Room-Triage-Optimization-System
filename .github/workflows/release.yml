name: Release and Publish Package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Semantic version tag to publish (for example v1.0.0)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: meditriage-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/coreyleath-code/meditriage-ai

jobs:
  release:
    name: Validate, release, and publish GHCR package
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Resolve immutable release tag
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            TAG="$REQUESTED_TAG"
          else
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
            TAG="${LATEST:-v1.0.0}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; got: $TAG" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Using existing immutable tag $TAG for release/package recovery."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
            git push origin "$TAG"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        run: git checkout --detach "${{ steps.version.outputs.tag }}"

      - name: Install release test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov ruff

      - name: Validate syntax and imports
        run: python -m compileall -q triage train_model.py evaluate_model.py benchmarks

      - name: Run correctness lint
        run: ruff check triage train_model.py evaluate_model.py test_model.py benchmarks --select E9,F63,F7,F82

      - name: Train deterministic release model
        run: python train_model.py

      - name: Run release test gate
        run: |
          pytest test_model.py -v \
            --cov=triage \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-results.xml \
            --cov-fail-under=85

      - name: Run held-out evaluation
        run: python evaluate_model.py

      - name: Build source release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="meditriage-ai-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="meditriage-ai-${VERSION}/" \
            -o "$ARCHIVE" "${{ steps.version.outputs.tag }}"
          sha256sum "$ARCHIVE" > SHA256SUMS

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish GHCR package
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Synthetic research demonstration only; not clinically validated and not for patient-care decisions

      - name: Create or repair GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="meditriage-ai-${VERSION}.tar.gz"

          cat > RELEASE_NOTES.md <<'EOF'
          ## Safety and evidence boundary

          This release is a synthetic research/engineering demonstration. It is not clinically validated, is not a medical device, and must not direct patient care or replace clinician judgment. Published benchmark/model evidence applies only to the repository's documented synthetic-data protocol.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$ARCHIVE" SHA256SUMS \
              --title "MediTriage AI $TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi

      - name: Publish release summary
        run: |
          echo "### MediTriage AI ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Release: published/repaired" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image digest: \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source archive and SHA256SUMS attached" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: synthetic research demonstration; not clinical deployment" >> "$GITHUB_STEP_SUMMARY"
